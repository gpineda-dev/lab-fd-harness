[project]
name = "fd-harness"
version = "0.1.0"
description = "Event-driven file descriptor supervisor microkernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
fd-harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
